name: Export GP021 live Cloudflare bundle

on:
  push:
    branches:
      - tooling/gp021-live-export
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify the live public runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          BASE = 'https://procedural.jtforme.com'
          OUT = pathlib.Path('dist')
          OUT.mkdir(parents=True, exist_ok=True)

          def get(path):
              url = BASE + '/' + urllib.parse.quote(path.lstrip('/'), safe='/._-')
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'JTforME-GP021-release-export/1.0',
                  'Accept': '*/*',
                  'Cache-Control': 'no-cache',
              })
              with urllib.request.urlopen(req, timeout=90) as response:
                  return response.read()

          manifest_bytes = get('build-manifest.json')
          manifest = json.loads(manifest_bytes.decode('utf-8'))
          files = manifest.get('files')
          if not isinstance(files, list) or len(files) < 20:
              raise SystemExit('Unexpected or incomplete build manifest')

          expected = {entry['path']: entry for entry in files}
          for entry in files:
              raw_path = entry['path']
              rel = pathlib.PurePosixPath(raw_path)
              if rel.is_absolute() or '..' in rel.parts or not rel.parts:
                  raise SystemExit(f'Unsafe manifest path: {raw_path!r}')
              if raw_path == '_headers':
                  continue
              data = get(raw_path)
              if len(data) != int(entry['bytes']):
                  raise SystemExit(f'Byte mismatch for {raw_path}: {len(data)} != {entry["bytes"]}')
              digest = hashlib.sha256(data).hexdigest()
              if digest != entry['sha256']:
                  raise SystemExit(f'SHA-256 mismatch for {raw_path}: {digest} != {entry["sha256"]}')
              target = OUT.joinpath(*rel.parts)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print(f'OK {raw_path} {len(data)}')

          # Cloudflare consumes _headers instead of serving it as an ordinary asset.
          # Recreate it exactly from the downloaded HTML using the repository's bundle algorithm.
          html = (OUT / 'index.html').read_text(encoding='utf-8')
          inline = re.findall(r'<script\b[^>]*>([\s\S]*?)</script>', html, flags=re.I)
          hashes = []
          for script in inline:
              if not script.strip():
                  continue
              normalized = script.replace('\r\n', '\n').replace('\r', '\n').encode('utf-8')
              hashes.append("'sha256-" + base64.b64encode(hashlib.sha256(normalized).digest()).decode('ascii') + "'")
          csp = (
              "default-src 'self'; script-src 'self' " + ' '.join(hashes) +
              "; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; "
              "connect-src 'self'; media-src 'self' blob:; object-src 'none'; "
              "base-uri 'none'; frame-ancestors 'none'; form-action 'none'"
          )
          headers = (
              '/*\n'
              '  Content-Security-Policy: ' + csp + '\n'
              '  X-Content-Type-Options: nosniff\n'
              '  Referrer-Policy: no-referrer\n'
              '  Permissions-Policy: camera=(), microphone=(), geolocation=(), payment=()\n'
              '  X-Frame-Options: DENY\n'
              '  Cache-Control: public, max-age=0, must-revalidate\n'
          ).encode('utf-8')
          header_entry = expected.get('_headers')
          if header_entry:
              if len(headers) != int(header_entry['bytes']):
                  raise SystemExit(f'_headers byte mismatch: {len(headers)} != {header_entry["bytes"]}')
              digest = hashlib.sha256(headers).hexdigest()
              if digest != header_entry['sha256']:
                  raise SystemExit(f'_headers SHA-256 mismatch: {digest} != {header_entry["sha256"]}')
          (OUT / '_headers').write_bytes(headers)

          # Preserve the exact deployed manifest and add a deployment note outside its hash inventory.
          (OUT / 'build-manifest.json').write_bytes(manifest_bytes)
          (OUT / 'DEPLOY.txt').write_text(
              'CARPOOLING TO HELL\'S ARCADE — GP021\n'
              'Cloudflare-ready static export captured from https://procedural.jtforme.com/\n'
              'Source PR: https://github.com/JTAHAI/carpooling-to-hells-arcade/pull/1\n'
              'PR head: 1103958b33afb06fde8d2a5f6a2e6de299f6d902\n'
              'Upload the CONTENTS of this archive so index.html remains at the deployment root.\n'
              'The optional room-code signaling Worker is deployed separately; this static bundle retains manual WebRTC pairing.\n',
              encoding='utf-8'
          )

          actual = [p for p in OUT.rglob('*') if p.is_file()]
          if not (OUT / 'index.html').is_file():
              raise SystemExit('index.html missing')
          print(f'Export complete: {len(actual)} files; manifest version {manifest.get("version")}')
          PY

      - name: Confirm deployment root
        run: |
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/build-manifest.json
          find dist -type f -printf '%P\n' | sort

      - name: Upload Cloudflare-ready ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: carpooling-to-hells-arcade-gp021-cloudflare
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          include-hidden-files: true
